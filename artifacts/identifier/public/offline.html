<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FF3C00" />
    <title>Identifly — Offline</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f2ee;
        color: #1a1a1a;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 2rem;
        text-align: center;
      }
      .icon {
        width: 80px;
        height: 80px;
        background: #1a3d2b;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon svg { width: 44px; height: 44px; color: #fff; }
      h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; }
      p { font-size: 1rem; color: #555; max-width: 280px; line-height: 1.6; }
      button {
        margin-top: 0.5rem;
        padding: 0.75rem 2rem;
        background: #1a3d2b;
        color: #fff;
        border: none;
        border-radius: 9999px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:active { opacity: 0.8; }
    </style>
  </head>
  <body>
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Identifly needs a connection to identify photos. Please reconnect and try again.</p>
    <button onclick="window.location.reload()">Try again</button>
  </body>
</html>
